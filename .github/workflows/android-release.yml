name: Android signed release APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version in mobile-version.json (e.g. 0.9.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: paytakt-signed-android-release
  cancel-in-progress: false

jobs:
  release:
    name: Sign and publish official Android APK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
      VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
      VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
      VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
      VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Validate requested release and configuration
        shell: bash
        run: |
          set -euo pipefail
          node -e '
            const f=require("./mobile-version.json")
            if (process.env.RELEASE_VERSION !== f.version || !/^\d+\.\d+\.\d+$/.test(f.version)) {
              console.error("Release input must match mobile-version.json exactly.")
              process.exit(1)
            }
            if (f.applicationId !== "ua.paytakt.mobile" || !Number.isSafeInteger(f.versionCode) || f.versionCode < 1) {
              console.error("Unexpected application ID or versionCode.")
              process.exit(1)
            }
          '
          for key in VITE_FIREBASE_API_KEY VITE_FIREBASE_AUTH_DOMAIN VITE_FIREBASE_PROJECT_ID VITE_FIREBASE_APP_ID ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!key:-}" ]]; then
              echo "::error title=Missing release secret::Configure $key in GitHub Actions secrets before building a signed APK."
              exit 1
            fi
          done
          if gh release view "v${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "::error::Release v${RELEASE_VERSION} already exists. Increment mobile-version.json for the next release."
            exit 1
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v${RELEASE_VERSION}" >/dev/null 2>&1; then
            echo "::error::Tag v${RELEASE_VERSION} already exists; refusing to overwrite an existing signed release."
            exit 1
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Install web dependencies
        run: npm ci

      - name: Run tests and validate source
        run: npm test

      - name: Build website and native Android project
        run: npm run android:setup

      - name: Assemble unsigned release
        working-directory: android
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Align and sign release APK with permanent key
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f "$RUNNER_TEMP/paytakt-release.jks"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/paytakt-release.jks"
          chmod 600 "$RUNNER_TEMP/paytakt-release.jks"
          test -s "$RUNNER_TEMP/paytakt-release.jks"
          mkdir -p signed
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$UNSIGNED"
          "$TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$RUNNER_TEMP/paytakt-aligned.apk"
          "$TOOLS/apksigner" sign \
            --ks "$RUNNER_TEMP/paytakt-release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "signed/PayTakt-Android-release.apk" \
            "$RUNNER_TEMP/paytakt-aligned.apk"
          "$TOOLS/apksigner" verify --verbose --print-certs "signed/PayTakt-Android-release.apk"
          "$TOOLS/zipalign" -c -v 4 "signed/PayTakt-Android-release.apk"
          PACKAGE_LINE=$("$TOOLS/aapt" dump badging "signed/PayTakt-Android-release.apk" | head -n 1)
          echo "$PACKAGE_LINE"
          CODE=$(node -p "require('./mobile-version.json').versionCode")
          [[ "$PACKAGE_LINE" == *"name='ua.paytakt.mobile'"* ]]
          [[ "$PACKAGE_LINE" == *"versionCode='$CODE'"* ]]
          [[ "$PACKAGE_LINE" == *"versionName='$RELEASE_VERSION'"* ]]

      - name: Upload signed APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PayTakt-Android-signed-v${{ inputs.version }}
          path: signed/PayTakt-Android-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Publish latest GitHub Release with APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          HASH=$(sha256sum signed/PayTakt-Android-release.apk | awk '{print $1}')
          CODE=$(node -p "require('./mobile-version.json').versionCode")
          cat > "$RUNNER_TEMP/paytakt-release-notes.md" <<EOF
          PayTakt Mobile v${RELEASE_VERSION} — official signed Android APK.

          Package: ua.paytakt.mobile
          Version code: ${CODE}
          SHA-256: ${HASH}

          Download **PayTakt-Android-release.apk** and open it on Android.
          You can install this and future APKs over each other only when they
          share the original signing key and the next versionCode is higher.

          **Moving from previous debug APKs:** these may use a different signing
          certificate, so direct updating may be blocked. Sync all PayTakt data
          with Firebase first, resolve offline queue items, then (if necessary)
          uninstall the old debug APK before installing this stable one. Uninstalling
          clears only device-local app data; cloud-synced account data remains.

          Signed APK keys are stored as GitHub Actions secrets, never in Git.
          EOF
          gh release create "v${RELEASE_VERSION}" \
            "signed/PayTakt-Android-release.apk#PayTakt Android release APK" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "PayTakt Mobile v${RELEASE_VERSION}" \
            --notes-file "$RUNNER_TEMP/paytakt-release-notes.md" \
            --latest
