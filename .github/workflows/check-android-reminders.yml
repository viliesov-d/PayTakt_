name: Check Android native build

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/setup-android.mjs'
      - 'src/lib/nativeReminders.ts'
      - 'src/lib/reminderPlan.ts'
      - 'src/components/NotificationSettings.tsx'
      - '.github/workflows/check-android-reminders.yml'
      - '.github/workflows/android-release.yml'
      - 'scripts/set-android-version.mjs'
      - 'mobile-version.json'
      - 'src/lib/appUpdates.ts'
      - 'src/components/AppUpdatesPanel.tsx'

permissions:
  contents: read

jobs:
  compile-android-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Install locked web dependencies
        run: npm ci
      - name: Build PayTakt and link Android Local Notifications
        run: npm run android:setup
      - name: Verify native notification/update plugins and shared app version
        shell: bash
        run: |
          set -euo pipefail
          test -d node_modules/@capacitor/local-notifications
          test -d node_modules/@capacitor/app
          test -d node_modules/@capacitor/browser
          for plugin in LocalNotifications AppPlugin BrowserPlugin; do
            grep -q "$plugin" android/app/src/main/assets/capacitor.plugins.json
          done
          CODE=$(node -p "require('./mobile-version.json').versionCode")
          VERSION=$(node -p "require('./mobile-version.json').version")
          grep -q "versionCode $CODE" android/app/build.gradle
          grep -q "versionName \"$VERSION\"" android/app/build.gradle
      - name: Compile debug and unsigned release APK (native Java + Gradle)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease
      - name: Verify Android package identity and increasing release code
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          VERSION=$(node -p "require('./mobile-version.json').version")
          CODE=$(node -p "require('./mobile-version.json').versionCode")
          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$APK"
          "$TOOLS/aapt" dump badging "$APK" | grep -E "^package: name='ua.paytakt.mobile' versionCode='$CODE' versionName='$VERSION'"
