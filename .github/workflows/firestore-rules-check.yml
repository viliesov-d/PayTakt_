name: Validate Firestore Rules

on:
  pull_request:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'tests/firestore-rules-delete.spec.mjs'
      - 'tests/firestore-admin.spec.mjs'
      - '.github/workflows/firestore-rules-check.yml'
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java for Firestore emulator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install rules unit test SDK (Firebase 12 compatible)
        run: npm install --no-audit --no-fund --no-save --no-package-lock @firebase/rules-unit-testing@5.0.2
      - name: Write temporary emulator config
        shell: bash
        run: |
          printf '%s\n' '{"firestore":{"rules":"firestore.rules"},"emulators":{"firestore":{"port":8080},"ui":{"enabled":false}}}' > firebase-rules-check.json
      - name: Compile Rules with the official Firestore emulator
        shell: bash
        run: |
          npx --yes firebase-tools@14.24.0 emulators:exec \
            --config firebase-rules-check.json \
            --project demo-paytakt \
            --only firestore \
            'node tests/firestore-rules-delete.spec.mjs && node tests/firestore-admin.spec.mjs'
